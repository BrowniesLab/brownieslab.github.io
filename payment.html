<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#442009">
  <title>Brownies Lab · Thanh toán</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><div class="topbar-inner" style="max-width:48rem"><a class="brand" href="order.html?tab=history"><img class="topbar-logo" src="metadata/Logo.png" alt=""><span>Brownies Lab<small>Thanh toán</small></span></a><span class="spacer"></span><a class="linkbtn" href="order.html?tab=history">Đơn của tôi</a></div></header>
  <main class="payment-wrap">
    <div class="payment-card">
      <p class="eyebrow">Bước 2 / 2</p><h1>Thanh toán đơn hàng</h1>
      <p class="muted" id="payment-order">Đang tải thông tin đơn…</p>
      <div id="payment-state" class="payment-state loading" style="height:3rem"></div>
      <div id="payment-content" hidden>
        <div class="qr-box" id="qr-box"></div>
        <p class="small muted">Quét mã và chuyển đúng số tiền — hệ thống tự nhận biết đã thanh toán trong ít phút, không cần làm gì thêm.</p>
        <!-- Gửi ảnh chuyển khoản thủ công: tạm ẩn khỏi giao diện khách từ khi có SePay tự động
             xác nhận (gửi ảnh sau khi đã thanh toán từng ghi đè nhầm PaymentStatus về "Chờ xác
             nhận", làm đơn không tự chuyển "Thanh toán thành công" nữa). Giữ lại code JS +
             action uploadPaymentProof phía backend làm phương án dự phòng, chỉ cần bỏ "hidden"
             ở dòng dưới để bật lại khi cần. -->
        <div id="proof-upload-box" hidden>
          <label class="upload-box" for="payment-proof"><span>↑</span><strong>Chọn ảnh chuyển khoản (dự phòng)</strong><small>JPG, PNG hoặc WEBP · tối đa 4 MB</small></label>
          <input id="payment-proof" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <img id="proof-preview" class="proof-preview" alt="Xem trước ảnh chuyển khoản" hidden>
          <button class="btn btn-primary btn-block" id="upload-proof" type="button" disabled>Gửi ảnh xác nhận thanh toán</button>
        </div>
      </div>
      <button class="btn btn-block" id="edit-order" type="button" hidden style="margin-top:.75rem">Quay lại chỉnh đơn</button>
      <a class="btn btn-block" href="order.html?tab=history" style="margin-top:.75rem">Xem đơn hàng của tôi</a>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    const session = requireSession();
    const $ = (id) => document.getElementById(id);
    const orderId = new URLSearchParams(location.search).get('order');
    let payment = null, file = null;
    if (!session || !orderId) location.replace('order.html');

    let pollTimer = null;
    function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
    function isPaidStatus(s) { return /đã thanh toán/i.test(s || ''); }

    function renderPayment(data) {
      payment = data;
      $('payment-order').textContent = `Tổng thanh toán: ${formatVND(data.total)}`;
      $('payment-state').className = 'payment-state';
      $('payment-state').textContent = `Trạng thái thanh toán: ${data.paymentStatus}`;
      $('payment-content').hidden = false;
      $('edit-order').hidden = data.paymentStatus !== 'Cần gửi minh chứng' || !sessionStorage.getItem('brownieslab.checkout');
      const qrUrl = data.qrUrl || 'metadata/qr.jpg';
      $('qr-box').innerHTML = `<img src="${escapeHtml(qrUrl)}" alt="Mã QR thanh toán"><span>Quét mã QR để thanh toán ${formatVND(data.total)}</span>`;
      if (data.proofUrl) { $('payment-state').innerHTML = `Trạng thái thanh toán: <strong>${escapeHtml(data.paymentStatus)}</strong> · <a href="${escapeHtml(data.proofUrl)}" target="_blank" rel="noopener noreferrer">Xem ảnh đã gửi</a>`; }
      if (isPaidStatus(data.paymentStatus)) {
        stopPolling();
        toast('Đã nhận được thanh toán!', 'success');
        setTimeout(() => location.replace('payment-success.html'), 700);
      }
    }
    /** Tự kiểm tra lại mỗi 3 giây — SePay báo về ngay khi có tiền vào, không cần khách bấm gì. */
    function startPolling() {
      stopPolling();
      pollTimer = setInterval(async () => {
        try { renderPayment(await api('paymentInfo', { orderId })); } catch (err) { /* thử lại lần poll sau */ }
      }, 3000);
    }
    async function init() {
      try { renderPayment(await api('paymentInfo', { orderId })); startPolling(); }
      catch (err) { $('payment-state').className = 'empty'; $('payment-state').textContent = err.message; handleError(err); }
    }

    $('payment-proof').addEventListener('change', (e) => {
      file = e.target.files[0] || null;
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) { file = null; e.target.value = ''; return handleError(new Error('Ảnh chuyển khoản phải nhỏ hơn 4 MB.')); }
      $('proof-preview').src = URL.createObjectURL(file); $('proof-preview').hidden = false; $('upload-proof').disabled = false;
    });
    $('upload-proof').addEventListener('click', () => {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const result = await withBusy($('upload-proof'), () => api('uploadPaymentProof', {
            orderId, filename: file.name, mimeType: file.type, base64: String(reader.result).split(',')[1]
          }), 'Đang gửi ảnh…');
          payment.paymentStatus = result.paymentStatus; payment.proofUrl = result.proofUrl; renderPayment(payment);
          stopPolling();
          toast('Đã gửi ảnh. Brownies Lab sẽ xác nhận thanh toán sớm.', 'success');
          sessionStorage.removeItem('brownieslab.checkout');
          sessionStorage.removeItem('brownieslab.checkout.form');
          setTimeout(() => location.replace('payment-success.html'), 700);
        } catch (err) { handleError(err); }
      };
      reader.readAsDataURL(file);
    });
    $('edit-order').addEventListener('click', async () => {
      if (!confirm('Đơn chờ thanh toán này sẽ được huỷ để bạn chỉnh lại món. Bạn có muốn tiếp tục?')) return;
      try {
        await withBusy($('edit-order'), () => api('cancelOrder', { orderId }), 'Đang quay lại…');
        location.replace('order.html?edit=1');
      } catch (err) { handleError(err); }
    });
    if (session && orderId) init();
  </script>
</body>
</html>
