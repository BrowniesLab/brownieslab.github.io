<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Web Interview Recorder</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/styles.css" />
</head>

<body class="bg-slate-100 min-h-screen flex justify-center items-center">
    <main class="w-full max-w-4xl bg-white shadow-lg rounded-xl p-6 space-y-6">

        <h1 class="text-2xl font-bold text-slate-800">Web Interview Recorder</h1>

        <!-- START SCREEN -->
        <section id="start-screen">
            <div class="space-y-3">
                <label class="block">
                    <span class="text-sm font-medium">Token</span>
                    <input id="token" class="input" />
                </label>

                <label class="block">
                    <span class="text-sm font-medium">Họ và tên</span>
                    <input id="userName" class="input" />
                </label>

                <button id="btnVerify" class="btn-primary">Verify & Start</button>
                <p id="startMessage" class="text-sm text-slate-600"></p>
            </div>
        </section>

        <!-- INTERVIEW SCREEN -->
        <section id="interview-screen" hidden>
            <div class="text-sm mb-2">
                Status: <span id="statusText" class="font-semibold text-blue-600">idle</span>
            </div>

            <h2 id="questionTitle" class="text-lg font-semibold"></h2>

            <video id="preview" autoplay playsinline muted class="w-full h-64 bg-black rounded-lg"></video>

            <div class="flex flex-wrap gap-2 mt-3">
                <button id="btnStartRecord" class="btn-green">Start Recording</button>
                <button id="btnStopRecord" class="btn-yellow" disabled>Stop</button>
                <button id="btnRestartRecord" class="btn-gray" disabled>Restart</button>
                <button id="btnNext" class="btn-blue" disabled>Next</button>
                <button id="btnFinish" class="btn-dark">Finish</button>
            </div>

            <div id="uploadStatus" class="text-sm mt-2"></div>
            <div id="retryArea" class="mt-2"></div>
        </section>

        <footer class="text-xs text-slate-500 border-t pt-2">
            Local dev only. Production requires HTTPS for camera/mic access.
        </footer>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
