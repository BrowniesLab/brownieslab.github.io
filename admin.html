<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#442009">
  <title>Brownies Lab · Quản trị</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin">
  <header class="topbar">
    <div class="topbar-inner" style="max-width:82rem">
      <a class="brand" href="admin.html">Brownies Lab<small>Quản trị dữ liệu</small></a>
      <span class="spacer"></span>
      <a class="linkbtn" href="order.html">Trang đặt bánh</a>
      <button class="linkbtn" id="logout" type="button">Đăng xuất</button>
    </div>
  </header>

  <main>
    <div class="tabs" role="tablist" id="sheet-tabs"></div>

    <div class="toolbar">
      <label class="field">
        <span class="sr-title">Tìm trong bảng</span>
        <input id="search" type="search" placeholder="Tìm trong bảng…">
      </label>
      <button class="btn btn-sm" id="reload" type="button">Tải lại</button>
      <button class="btn btn-sm btn-dark" id="add" type="button">+ Thêm dòng</button>
    </div>
    <p class="small muted" id="meta"></p>

    <div class="table-wrap">
      <table class="grid" id="grid">
        <tbody><tr><td class="loading" style="height:3rem"></td></tr></tbody>
      </table>
    </div>
  </main>

  <dialog id="editor">
    <form method="dialog" id="editor-form">
      <h2 id="editor-title">Sửa dòng</h2>
      <div id="editor-fields"></div>
      <p class="small muted" id="editor-hint"></p>
      <div class="actions-row">
        <button class="btn btn-danger btn-sm" type="button" id="editor-delete">Xoá dòng</button>
        <span style="flex:1"></span>
        <button class="btn btn-sm" type="button" id="editor-cancel">Huỷ</button>
        <button class="btn btn-primary btn-sm" type="submit" id="editor-save">Lưu</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
  <script>
    const SHEETS = ['Orders','Users','Menu','Sessions'];
    const LABELS = { Orders:'Đơn hàng', Users:'Khách hàng', Menu:'Menu', Sessions:'Phiên đăng nhập' };
    const session = requireSession({ admin: true });
    const $ = (id) => document.getElementById(id);

    let current = SHEETS[0];
    let table   = { headers: [], rows: [] };
    let editing = null;

    $('sheet-tabs').innerHTML = SHEETS.map(s =>
      `<button class="tab" role="tab" data-sheet="${s}" aria-selected="${s===current}">${LABELS[s]}</button>`
    ).join('');
    $('sheet-tabs').addEventListener('click', (e) => {
      const b = e.target.closest('[data-sheet]');
      if (!b) return;
      current = b.dataset.sheet;
      document.querySelectorAll('#sheet-tabs .tab').forEach(t =>
        t.setAttribute('aria-selected', String(t === b)));
      $('search').value = '';
      load();
    });
    $('logout').addEventListener('click', logout);
    $('reload').addEventListener('click', load);
    $('search').addEventListener('input', render);
    $('add').addEventListener('click', () => openEditor(null));
    $('editor-cancel').addEventListener('click', () => $('editor').close());

    if (session) load();

    async function load() {
      $('grid').innerHTML = '<tbody><tr><td class="loading" style="height:3rem"></td></tr></tbody>';
      try {
        table = await api('adminListSheet', { sheet: current });
        render();
      } catch (err) {
        $('grid').innerHTML = '<tbody><tr><td class="empty">Không tải được dữ liệu.</td></tr></tbody>';
        handleError(err);
      }
    }

    function cellText(v) {
      if (v === true)  return 'TRUE';
      if (v === false) return 'FALSE';
      return v === null || v === undefined ? '' : String(v);
    }

    function cellHtml(header, value) {
      const text = cellText(value);
      if (current === 'Orders' && header === 'ItemsJSON') return escapeHtml(orderItemsTextFromValue(text));
      if (current === 'Orders' && header === 'PaymentProofUrl' && /^https?:\/\//i.test(text)) {
        return `<a class="grid-link" href="${escapeHtml(text)}" target="_blank" rel="noopener noreferrer">Xem ảnh</a>`;
      }
      return escapeHtml(text);
    }

    function orderValue(row, header) {
      const i = table.headers.indexOf(header);
      return i < 0 ? '' : cellText(row.values[i]);
    }

    function orderItemsTextFromValue(value) {
      try {
        const items = JSON.parse(value || '[]');
        return items.map(i => `${i.name || i.itemId || 'Bánh'} × ${Number(i.qty) || 0}`).join(', ') || '—';
      } catch (e) { return value || '—'; }
    }

    function orderItemsText(row) { return orderItemsTextFromValue(orderValue(row, 'ItemsJSON')); }

    function fieldLabel(header) {
      const labels = {
        Status: 'Trạng thái đơn', Note: 'Ghi chú đơn', Phone: 'Số điện thoại',
        Name: 'Họ và tên', Points: 'Điểm thưởng', IsAdmin: 'Quyền quản trị',
        CreatedAt: 'Ngày tạo', SocialLink: 'Liên kết mạng xã hội',
        ItemID: 'Mã món', Description: 'Mô tả', Active: 'Đang bán', Price: 'Giá bán',
        Token: 'Mã phiên', ExpiresAt: 'Hết hạn'
      };
      return labels[header] || header;
    }

    function needsPaymentConfirmation(row) {
      if (current !== 'Orders') return false;
      const method = orderValue(row, 'PaymentMethod');
      const status = orderValue(row, 'PaymentStatus');
      const proof = orderValue(row, 'PaymentProofUrl');
      const credited = /^true$/i.test(orderValue(row, 'PointsCredited'));
      const cancelled = /huỷ|hủy|cancel/i.test(orderValue(row, 'Status') + ' ' + status);
      if (credited || cancelled) return false;
      if (method === 'Thanh toán trước') return Boolean(proof) && /chờ xác nhận|đã thanh toán/i.test(status);
      return method === 'Thanh toán khi nhận hàng';
    }

    function renderOrderRefs(rows) {
      const body = rows.length ? rows.map(r => {
        const proof = orderValue(r, 'PaymentProofUrl');
        return `<tr class="order-ref-row" data-row="${r.rowIndex}"><td colspan="2">
          <button class="order-ref" type="button" data-edit="${r.rowIndex}">
            <span class="order-ref-top"><strong>${escapeHtml(orderValue(r, 'CustomerName') || 'Khách hàng')}</strong><span class="status">${escapeHtml(orderValue(r, 'Status') || '—')}</span></span>
            <span class="order-ref-meta">${escapeHtml(orderValue(r, 'Phone'))} · ${escapeHtml(orderValue(r, 'CreatedAt'))}</span>
            <span class="order-ref-items">${escapeHtml(orderItemsText(r))}</span>
            <span class="order-ref-total">${formatVND(orderValue(r, 'Total'))} · ${/^true$/i.test(orderValue(r, 'PointsCredited')) ? 'Đã cộng' : 'Chờ cộng'} +${escapeHtml(orderValue(r, 'PointsEarned'))} điểm</span>
          </button>
          <span class="order-ref-actions"><span class="status payment">${escapeHtml(orderValue(r, 'PaymentMethod') || 'Chưa chọn')} · ${escapeHtml(orderValue(r, 'PaymentStatus') || 'Chưa thanh toán')}</span>${proof ? `<a class="btn btn-sm" href="${escapeHtml(proof)}" target="_blank" rel="noopener noreferrer">Xem ảnh</a>` : ''}${needsPaymentConfirmation(r) ? `<button class="btn btn-sm btn-dark" type="button" data-confirm-payment="${r.rowIndex}">Xác nhận TT &amp; cộng điểm</button>` : ''}</span>
        </td></tr>`;
      }).join('') : '<tr><td class="empty" colspan="2">Không có đơn nào.</td></tr>';
      $('grid').innerHTML = '<tbody>' + body + '</tbody>';
    }

    function render() {
      $('add').hidden = current === 'Orders';
      const q = $('search').value.trim().toLowerCase();
      const rows = q ? table.rows.filter(r => r.values.some(v => cellText(v).toLowerCase().includes(q))) : table.rows;
      $('meta').textContent = `${LABELS[current]} · ${rows.length}/${table.rows.length} dòng · bấm vào một dòng để sửa`;
      if (current === 'Orders') { renderOrderRefs(rows); return; }
      const head = `<thead><tr><th>#</th>${table.headers.map(h => `<th>${escapeHtml(h||'(trống)')}</th>`).join('')}<th></th></tr></thead>`;
      const body = rows.length
        ? rows.map(r => `
          <tr data-row="${r.rowIndex}">
            <td class="rownum">${r.rowIndex}</td>
            ${table.headers.map((h,i) => `<td title="${escapeHtml(cellText(r.values[i]))}">${cellHtml(h, r.values[i])}</td>`).join('')}
            <td class="actions">${needsPaymentConfirmation(r) ? `<button class="btn btn-sm btn-dark" type="button" data-confirm-payment="${r.rowIndex}">Xác nhận TT &amp; cộng điểm</button>` : ''}<button class="btn btn-sm" type="button" data-edit="${r.rowIndex}">Sửa</button></td>
          </tr>`).join('')
        : `<tr><td class="empty" colspan="${table.headers.length+2}">Không có dòng nào.</td></tr>`;
      $('grid').innerHTML = head + '<tbody>' + body + '</tbody>';
    }

    $('grid').addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      const confirmPayment = e.target.closest('[data-confirm-payment]');
      if (confirmPayment) { confirmPaymentForRow(Number(confirmPayment.dataset.confirmPayment), confirmPayment); return; }
      const tr = e.target.closest('tr[data-row]');
      if (!tr) return;
      openEditor(table.rows.find(r => r.rowIndex === Number(tr.dataset.row)));
    });

    $('editor-fields').addEventListener('click', (e) => {
      const confirmPayment = e.target.closest('[data-confirm-payment]');
      if (confirmPayment) confirmPaymentForRow(Number(confirmPayment.dataset.confirmPayment), confirmPayment);
    });

    async function confirmPaymentForRow(rowIndex, button) {
      const row = table.rows.find(r => r.rowIndex === rowIndex);
      const points = orderValue(row, 'PointsEarned');
      if (!row || !confirm(`Xác nhận khách đã thanh toán đơn này? Hệ thống sẽ cộng +${points} điểm đúng một lần.`)) return;
      try {
        const r = await withBusy(button, () => api('adminConfirmPayment', {
          rowIndex, matchKey: cellText(row.values[0])
        }), 'Đang xác nhận…');
        toast(r.credited ? `Đã xác nhận thanh toán và cộng +${points} điểm.` : 'Đơn này đã được cộng điểm trước đó.', 'success'); load();
      } catch (err) { handleError(err); }
    }

    function openEditor(row) {
      editing = row;
      $('editor-title').textContent = row
        ? (current === 'Orders' ? `Chi tiết đơn · ${orderValue(row, 'CustomerName') || 'Khách hàng'}` : `Sửa dòng ${row.rowIndex} · ${LABELS[current]}`)
        : `Thêm dòng · ${LABELS[current]}`;
      $('editor-delete').hidden = !row;
      const orderDetail = current === 'Orders' && row ? `<div class="order-detail"><p><strong>Khách đặt:</strong> ${escapeHtml(orderValue(row, 'CustomerName'))} · ${escapeHtml(orderValue(row, 'Phone'))}</p><p><strong>Người nhận:</strong> ${escapeHtml(orderValue(row, 'RecipientName'))} · ${escapeHtml(orderValue(row, 'RecipientPhone'))}</p><p><strong>Đơn bánh:</strong> ${escapeHtml(orderItemsText(row))} · <strong>${formatVND(orderValue(row, 'Total'))}</strong></p><p><strong>Nhận hàng:</strong> ${escapeHtml(orderValue(row, 'FulfillmentType'))} · ${escapeHtml(orderValue(row, 'PickupDate'))} · ${escapeHtml(orderValue(row, 'PickupTime'))}</p>${orderValue(row, 'PickupLocation') ? `<p><strong>Điểm nhận:</strong> ${escapeHtml(orderValue(row, 'PickupLocation'))}</p>` : ''}${orderValue(row, 'DeliveryAddress') ? `<p><strong>Địa chỉ giao:</strong> ${escapeHtml(orderValue(row, 'DeliveryAddress'))}</p>` : ''}${orderValue(row, 'RecipientMessage') ? `<p><strong>Lời nhắn người nhận:</strong> ${escapeHtml(orderValue(row, 'RecipientMessage'))}</p>` : ''}${orderValue(row, 'Note') ? `<p><strong>Ghi chú đơn:</strong> ${escapeHtml(orderValue(row, 'Note'))}</p>` : ''}<p><strong>Thanh toán:</strong> ${escapeHtml(orderValue(row, 'PaymentMethod'))} · ${escapeHtml(orderValue(row, 'PaymentStatus'))} · ${/^true$/i.test(orderValue(row, 'PointsCredited')) ? 'Đã cộng điểm' : 'Chưa cộng điểm'}</p>${orderValue(row, 'PaymentProofUrl') ? `<p><a class="grid-link" href="${escapeHtml(orderValue(row, 'PaymentProofUrl'))}" target="_blank" rel="noopener noreferrer">Xem ảnh chuyển khoản</a></p>` : ''}${needsPaymentConfirmation(row) ? `<button class="btn btn-primary btn-sm" type="button" data-confirm-payment="${row.rowIndex}">Xác nhận thanh toán &amp; cộng điểm</button>` : ''}</div>` : '';
      $('editor-fields').innerHTML = orderDetail + table.headers.map((h,i) => {
        if (!h) return '';
        if (current === 'Orders' && row && h !== 'Status') return '';
        const v    = row ? cellText(row.values[i]) : '';
        const long = v.length > 60 || /json|note|description/i.test(h);
        const inp  = long
          ? `<textarea name="${escapeHtml(h)}" rows="4">${escapeHtml(v)}</textarea>`
          : `<input name="${escapeHtml(h)}" value="${escapeHtml(v)}">`;
        return `<label class="field"><span>${escapeHtml(fieldLabel(h))}</span>${inp}</label>`;
      }).join('');
      $('editor-hint').textContent = current === 'Users'
        ? 'Mẹo: nhập PIN mới 4–6 số vào ô PinHash để đặt lại PIN. Đúng/sai nhập TRUE/FALSE.'
        : current === 'Orders' ? 'Chỉ sửa trạng thái đơn tại đây. Thanh toán và điểm được xác nhận bằng nút “Xác nhận TT & cộng điểm” ở thẻ đơn.'
        : 'Đúng/sai nhập TRUE/FALSE, ngày nhập dạng yyyy-mm-dd hh:mm.';
      $('editor').showModal();
    }

    $('editor-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {};
      table.headers.forEach((h,i) => {
        if (!h) return;
        const el = $('editor-form').elements[h];
        if (!el) return;
        if (editing && el.value === cellText(editing.values[i])) return;
        data[h] = el.value;
      });
      if (editing && !Object.keys(data).length) { $('editor').close(); return; }
      try {
        await withBusy($('editor-save'), () => editing
          ? api('adminUpdateRow', { sheet: current, rowIndex: editing.rowIndex, data, matchKey: cellText(editing.values[0]) })
          : api('adminAddRow',    { sheet: current, data }), 'Đang lưu…');
        $('editor').close(); toast('Đã lưu.', 'success'); load();
      } catch (err) { handleError(err); }
    });

    $('editor-delete').addEventListener('click', async () => {
      if (!editing || !confirm(`Xoá dòng ${editing.rowIndex} khỏi ${current}? Không thể hoàn tác.`)) return;
      try {
        await withBusy($('editor-delete'), () => api('adminDeleteRow', {
          sheet: current, rowIndex: editing.rowIndex, matchKey: cellText(editing.values[0])
        }), 'Đang xoá…');
        $('editor').close(); toast('Đã xoá.', 'success'); load();
      } catch (err) { handleError(err); }
    });
  </script>
</body>
</html>
