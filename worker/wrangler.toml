name = "brownies-lab"
main = "src/index.js"
compatibility_date = "2026-09-24"

# 1) wrangler d1 create brownies-lab-db
#    -> dán database_id trả về vào đây.
[[d1_databases]]
binding = "DB"
database_name = "brownies-lab-db"
database_id = "a51e2f70-24f3-44c2-af8a-5970dadf3a61"

# Ảnh minh chứng thanh toán lưu thẳng trong D1 (base64), không cần dịch vụ lưu trữ ngoài.
[vars]
POINTS_PER_BOX = "1"
FIRST_ORDER_BONUS = "2"
FREE_BOX_POINTS = "10"
SESSION_DAYS = "30"
MAX_LOGIN_FAILS = "5"
LOCK_MINUTES = "15"
NEW_ORDER_STATUS = "Mới"
PAYMENT_QR_URL = ""

# Secret, KHÔNG đặt trong file này (không commit lên git):
#   wrangler secret put PIN_SALT
