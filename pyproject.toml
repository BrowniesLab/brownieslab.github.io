[tool.poetry]
name = "web-interview-recorder"
version = "0.1.0"
description = "Per-question video recorder and uploader for interview tasks"
authors = ["Student <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.95.2"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
python-multipart = "^0.0.6"
python-dateutil = "^2.8.2"
pytz = "^2024.1"
google-cloud-speech = "^2.34.0" 
moviepy = "^2.0.0" 

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"